<div class="experience-card">
  <div class="card-image">
    <img [src]="experience.imageUrl" [alt]="experience.company" class="company-logo">
  </div>
  <div class="card-content">
    <div class="card-header">
      <h3 class="company">{{ experience.company }}</h3>
      <span class="period">{{ experience.period }}</span>
    </div>
    <h4 class="role">{{ experience.role }}</h4>
    <div *ngIf="experience.project" class="project">
      <span>{{ experience.project }}</span>
    </div>
    <div *ngIf="experience.location" class="location">
      <span>{{ experience.location }}</span>
    </div>
    <p class="description">{{ experience.description }}</p>
  </div>
</div>
